services:
  db:
    image: postgres:16-alpine
    container_name: mekuru-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mekuru_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
